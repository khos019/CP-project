# Judge0 CE, self-hosted. See JUDGE0-SETUP.md at the repo root for the host
# preparation this depends on — in particular the cgroup v1 kernel flag, which
# is the one step that cannot be done from inside Docker.
#
# Pinned rather than :latest on purpose: a judge that silently changes compiler
# versions changes verdicts, and a verdict is the one thing on this site that
# has to be reproducible.
services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    # Bound to localhost only. Caddy terminates TLS and is the single way in;
    # exposing 2358 to the internet would publish an unauthenticated compiler.
    ports:
      - "127.0.0.1:2358:2358"
    privileged: true
    restart: always
    depends_on:
      - db
      - redis

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: always
    depends_on:
      - db
      - redis

  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7.2.4
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    restart: always

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    restart: always
    depends_on:
      - server
