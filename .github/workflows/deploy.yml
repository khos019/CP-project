name: Deploy to Cloudflare

# Every push to main rebuilds the site and deploys it to
# https://algoyol.uz
# Run it by hand from the Actions tab with "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race each other. A newer push waits for the
# running one to finish rather than cancelling it half-uploaded.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Fail loudly and early with a readable message, rather than deploying
      # a build that silently lost its Supabase config.
      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
                      NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them at Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          echo "All required secrets are present."

      - run: npm ci

      # vinext deploy builds and uploads in one step, exactly like `npm run
      # deploy` does locally. The NEXT_PUBLIC_* values are inlined into the
      # client bundle at build time, so they must be set here, not at runtime.
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://algoyol.uz' }}
          # Optional. Left empty, app/api/judge falls back to the public
          # ce.judge0.com endpoint.
          JUDGE0_URL: ${{ secrets.JUDGE0_URL }}
          JUDGE0_API_KEY: ${{ secrets.JUDGE0_API_KEY }}
          JUDGE0_API_HOST: ${{ secrets.JUDGE0_API_HOST }}
        # A secret pasted as a whole .env line ("NEXT_PUBLIC_SUPABASE_URL=https://...")
        # once got inlined verbatim, so every Supabase call went to
        # algoyol.uz/NEXT_PUBLIC_SUPABASE_URL=... and the backend looked dead.
        # Strip any leading NAME= and surrounding quotes/whitespace, then refuse
        # to deploy unless the URL is a real https origin.
        run: |
          clean() {
            local v="${!1}"
            v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"
            if [[ "$v" =~ ^(NEXT_PUBLIC_|JUDGE0_)[A-Z0-9_]*=(.*)$ ]]; then v="${BASH_REMATCH[2]}"; fi
            v="${v#[\"\']}"; v="${v%[\"\']}"
            export "$1=$v"
          }
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_SITE_URL \
                      JUDGE0_URL JUDGE0_API_KEY JUDGE0_API_HOST; do
            clean "$name"
          done
          if [[ ! "$NEXT_PUBLIC_SUPABASE_URL" =~ ^https://[a-z0-9]+\.supabase\.co/?$ ]]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL secret is not a https://<ref>.supabase.co URL."
            exit 1
          fi
          npm run deploy

      # Proves the deploy actually took, instead of trusting a green check.
      - name: Verify the site responds
        run: |
          url="${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://algoyol.uz' }}"
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "$url returned 200."
              exit 0
            fi
            echo "Attempt $attempt: got $code, retrying in 5s..."
            sleep 5
          done
          echo "::error::$url did not return 200 after the deploy."
          exit 1
