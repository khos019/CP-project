<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AlgoYo‘l">
  <title>AlgoYo‘l</title>
  <!--
    Favicon cut: the same staircase, pushed to the tile edges and thickened.
    At 16px the strokes are what survive, so the node is dropped and the steps
    carry the shape on their own.
  -->
  <defs>
    <linearGradient id="ay-fav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8ff76"/>
      <stop offset="1" stop-color="#67ce44"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#ay-fav)"/>
  <path d="M12 50 H28 V33 H44 V16 H53" stroke="#071008" stroke-width="8.5"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
