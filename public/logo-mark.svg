<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AlgoYo‘l">
  <title>AlgoYo‘l</title>
  <!--
    Three nodes climbing left to right along a path, the last one ringed — the
    same figure the roadmap graph draws on the front page, so the favicon and
    the product are one picture. Colours are the app's own: lime tile, ink glyph.
  -->
  <defs>
    <linearGradient id="ay-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8ff76"/>
      <stop offset="1" stop-color="#67ce44"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="17" fill="url(#ay-tile)"/>
  <g stroke="#071008" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M14 48 H28 V34 H42 V20 H51" stroke-width="6.4"/>
  </g>
  <circle cx="51" cy="20" r="5.4" fill="#071008"/>
</svg>
