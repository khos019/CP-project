<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 64" width="268" height="64" role="img" aria-label="AlgoYo‘l">
  <title>AlgoYo‘l</title>
  <!--
    Horizontal lockup for places outside the app itself (README, docs, social).
    Inside the app the header composes the mark with live HTML text instead, so
    the wordmark always matches the running typography.
  -->
  <defs>
    <linearGradient id="ay-lock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8ff76"/>
      <stop offset="1" stop-color="#67ce44"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="17" fill="url(#ay-lock)"/>
  <g stroke="#071008" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round" fill="#071008">
    <path d="M17.5 47 L32 17 L46.5 47" fill="none"/>
    <path d="M22.4 37 L41.6 37" fill="none"/>
    <circle cx="32" cy="17" r="5.4"/>
    <circle cx="17.5" cy="47" r="4.7"/>
    <circle cx="46.5" cy="47" r="4.7"/>
  </g>

  <text x="82" y="42.5"
        font-family="Inter, 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="800" letter-spacing="-1.1" fill="#f6fff8">Algo<tspan fill="#c8ff76">Yo‘l</tspan></text>
</svg>
