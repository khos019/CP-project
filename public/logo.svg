  <text x="82" y="42.5"
        font-family="'Space Grotesk', Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-1.1" fill="#f6fff8">Algo<tspan fill="#c8ff76">Yo‘l</tspan></text>
