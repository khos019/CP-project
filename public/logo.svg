    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#121b17"/>
  <g stroke="#3b5145" stroke-width="4.8" stroke-linecap="round">
    <path d="M19 17 V47"/>
    <path d="M50 17 V47"/>
  </g>
  <g stroke="url(#ay-arrow)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
